# Tests never talk to a real Keycloak: point at a closed port so calls fail fast with keycloak_unreachable.
kc-mcp.url=http://127.0.0.1:1
kc-mcp.grant-type=password
kc-mcp.username=admin
kc-mcp.password=admin
kc-mcp.tool-exposure=hybrid
kc-mcp.spi.acme.greeting=hello from config
kc-mcp.spi.disabled-demo.enabled=false
quarkus.mcp.server.traffic-logging.enabled=false
