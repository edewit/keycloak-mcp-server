# A release from a tag: `git tag v1.0.0 && git push origin v1.0.0` builds the distribution with that version and
# publishes a GitHub release with keycloak-mcp-server-<version>.tar.gz and .zip attached. The tag's version replaces
# the pom's for the build only; nothing is committed.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the distribution
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set the version from the tag
        run: ./mvnw versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Build and test, package the distribution
        run: ./mvnw verify -DskipITs=false

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "keycloak-mcp-server $VERSION" \
            --generate-notes \
            modules/distribution/target/keycloak-mcp-server-"$VERSION".tar.gz \
            modules/distribution/target/keycloak-mcp-server-"$VERSION".zip
