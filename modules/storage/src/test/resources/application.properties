# Storage module tests run against PostgreSQL started by Dev Services (Docker), the production database kind.
# The datasource URL comes from Dev Services at runtime, so the switch is set explicitly here.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.image-name=postgres:17-alpine
kc-mcp.storage.enabled=true
kc-mcp.storage.secret-key=test-passphrase
