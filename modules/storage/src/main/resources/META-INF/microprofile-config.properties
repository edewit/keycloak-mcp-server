# Defaults of the storage module (keycloak-mcp-server-storage). The module is dormant until a JDBC datasource is
# configured: kc-mcp.storage.enabled defaults to whether quarkus.datasource.jdbc.url is set (StorageEnabledInterceptorFactory, a config interceptor)
# and can be forced either way. The application's own configuration and environment variables override these values.
# The database kind is fixed when the application is built: h2 (embedded, the default) or postgresql
# (./mvnw package -Ppostgresql); both drivers are on the class path.
quarkus.datasource.db-kind=h2
quarkus.datasource.active=${kc-mcp.storage.enabled}
# no throw-away database in dev and test mode unless a build asks for one
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.active=${kc-mcp.storage.enabled}
# the schema is Liquibase's job, Hibernate only maps it
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.liquibase.enabled=${kc-mcp.storage.enabled}
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/kc-mcp/changelog.xml
