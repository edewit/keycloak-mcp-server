# English texts of the configuration specs (ConfigMessageKeys); UTF-8.

audit-scrubber.pii.mode.label=Mode
audit-scrubber.pii.mode.description=What happens to personal data: keep (nothing happens), pseudonymize (keyed hash) or drop.
audit-scrubber.pii.args.label=Personal arguments
audit-scrubber.pii.args.description=Tool argument names treated as personal data; 'id' counts too on user tools.
audit-scrubber.pii.targets.label=Listeners
audit-scrubber.pii.targets.description=Audit listener ids the scrubber applies to, '*' for every listener.
audit-scrubber.pii.pseudonym-key.label=Pseudonym key
audit-scrubber.pii.pseudonym-key.description=HMAC key of the pseudonyms; defaults to kc-mcp.storage.secret-key, which a rotation changes.
audit-listener.db.retention-days.label=Retention (days)
audit-listener.db.retention-days.description=Deletes audit rows older than this, at startup and then hourly; 0 keeps everything.
key-vault.db.retired-key-grace-seconds.label=Retired key grace (seconds)
key-vault.db.retired-key-grace-seconds.description=How long a rotated-away key stays in the JWKS.
system-repository.db.cache-seconds.label=Cache (seconds)
system-repository.db.cache-seconds.description=How long a snapshot of the rows is served before it is reloaded.
