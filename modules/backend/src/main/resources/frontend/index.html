<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Management UI for the Keycloak MCP Server: systems, realms, and server settings."
    />
    <title>Keycloak MCP Server</title>
    <style>
      html {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }

      /*
       * Document owns the shell layout. Session is a light-DOM host that provides
       * context; toolbar, nav and outlet are siblings that update independently.
       */
      kc-mcp-session {
        --fg: #1f2328;
        --muted: #656d76;
        --bg: #f6f8fa;
        --card: #ffffff;
        --border: #d0d7de;
        --error: #cf222e;
        --pre-bg: #f6f8fa;
        --accent: #1f6feb;
        --nav-width: 13.5rem;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        color: var(--fg);
        background: var(--bg);
      }
      @media (prefers-color-scheme: dark) {
        kc-mcp-session {
          --fg: #e6edf3;
          --muted: #8b949e;
          --bg: #0d1117;
          --card: #161b22;
          --border: #30363d;
          --error: #ff7b72;
          --pre-bg: #0d1117;
          --accent: #2f81f7;
        }
      }

      kc-mcp-session[state='loading'] > :not(.boot) {
        display: none;
      }
      kc-mcp-session:not([state='loading']) > .boot {
        display: none;
      }
      kc-mcp-session:not(:defined) > :not(.boot) {
        display: none;
      }

      .boot {
        box-sizing: border-box;
        padding: 1.5rem;
        max-width: 36rem;
        color: var(--muted, #656d76);
      }
      .boot h1 {
        margin: 0 0 0.5rem;
        font-size: 1.1rem;
        color: var(--fg, inherit);
      }
      .boot p {
        margin: 0;
      }

      .layout {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      .layout kc-mcp-nav {
        flex: 0 0 var(--nav-width);
        align-self: stretch;
      }
      .layout > main {
        flex: 1;
        min-width: 0;
        padding: 1.5rem;
        display: grid;
        gap: 1rem;
        align-content: start;
      }
      @media (max-width: 640px) {
        .layout {
          flex-direction: column;
        }
        .layout kc-mcp-nav {
          flex: none;
        }
      }

      noscript {
        display: block;
        box-sizing: border-box;
        padding: 1.5rem;
        max-width: 36rem;
      }
      noscript h1 {
        margin: 0 0 0.5rem;
        font-size: 1.1rem;
      }
      noscript p {
        margin: 0;
        color: #656d76;
      }
      @media (prefers-color-scheme: dark) {
        noscript p {
          color: #8b949e;
        }
      }
    </style>
    {#bundle /}
  </head>
  <body>
    <kc-mcp-session state="loading">
      <div class="boot">
        <h1>Keycloak MCP</h1>
        <p>Loading the management UI…</p>
      </div>
      <kc-mcp-toolbar></kc-mcp-toolbar>
      <div class="layout">
        <kc-mcp-nav></kc-mcp-nav>
        <main>
          <kc-mcp-outlet></kc-mcp-outlet>
        </main>
      </div>
    </kc-mcp-session>
    <noscript>
      <h1>Keycloak MCP</h1>
      <p>
        The management UI needs JavaScript. Enable it in this browser, or use the admin API and MCP endpoints
        directly.
      </p>
    </noscript>
  </body>
</html>
