<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Management UI for the Keycloak MCP Server: systems, realms, and server settings."
    />
    <title>Keycloak MCP Server</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;700&family=Red+Hat+Text:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Theme tokens live in app/theme.css (bundled via app/index.ts): override --kc-mcp-global--*
      or --kc-mcp-c-* on kc-mcp-session, PatternFly-style. See that file's header.
    -->
    <style>
      html {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font: 16px/1.5 'Red Hat Text', 'RedHatText', Helvetica, Arial, sans-serif;
      }

      /*
       * Document owns the shell layout. Session is a light-DOM host that provides
       * context; toolbar, nav and outlet are siblings that update independently.
       * Colors / type come from theme.css on kc-mcp-session.
       */
      kc-mcp-session[state='loading'] > :not(.boot) {
        display: none;
      }
      kc-mcp-session:not([state='loading']) > .boot {
        display: none;
      }
      kc-mcp-session:not(:defined) > :not(.boot) {
        display: none;
      }

      .boot {
        box-sizing: border-box;
        padding: var(--kc-mcp-global--spacer--lg, 1.5rem);
        max-width: 36rem;
        color: var(--muted, #6a6e73);
      }
      .boot h1 {
        margin: 0 0 0.5rem;
        font-family: var(--font-heading, 'Red Hat Display', sans-serif);
        font-size: 1.125rem;
        font-weight: 400;
        color: var(--fg, #151515);
      }
      .boot p {
        margin: 0;
      }

      .layout {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      .layout kc-mcp-nav {
        flex: 0 0 var(--nav-width, 15rem);
        align-self: stretch;
      }
      .layout > main {
        flex: 1;
        min-width: 0;
        padding: var(--kc-mcp-c-page--Padding, 1.5rem);
        display: grid;
        gap: var(--kc-mcp-c-page--Gap, 1rem);
        align-content: start;
      }
      @media (max-width: 640px) {
        .layout {
          flex-direction: column;
        }
        .layout kc-mcp-nav {
          flex: none;
        }
      }

      noscript {
        display: block;
        box-sizing: border-box;
        padding: 1.5rem;
        max-width: 36rem;
      }
      noscript h1 {
        margin: 0 0 0.5rem;
        font-size: 1.1rem;
      }
      noscript p {
        margin: 0;
        color: #6a6e73;
      }
      @media (prefers-color-scheme: dark) {
        noscript p {
          color: #c7c7c7;
        }
      }
    </style>
    {#bundle /}
  </head>
  <body>
    <kc-mcp-session state="loading">
      <div class="boot">
        <h1>Keycloak MCP</h1>
        <p>Loading the management UI…</p>
      </div>
      <kc-mcp-toolbar></kc-mcp-toolbar>
      <div class="layout">
        <kc-mcp-nav></kc-mcp-nav>
        <main>
          <kc-mcp-outlet></kc-mcp-outlet>
        </main>
      </div>
    </kc-mcp-session>
    <noscript>
      <h1>Keycloak MCP</h1>
      <p>
        The management UI needs JavaScript. Enable it in this browser, or use the admin API and MCP endpoints
        directly.
      </p>
    </noscript>
  </body>
</html>
