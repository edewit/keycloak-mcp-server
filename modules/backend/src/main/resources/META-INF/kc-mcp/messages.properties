# English texts of the configuration specs (ConfigMessageKeys); UTF-8.

config.jwt-key-file.label=Key file
config.jwt-key-file.description=PEM file (PKCS#8) of the private key the client assertions are signed with.
config.jwt-keystore-file.label=Keystore file
config.jwt-keystore-file.description=Keystore holding the signing key, instead of jwt-key-file.
config.jwt-keystore-password.label=Keystore password
config.jwt-keystore-type.label=Keystore type
config.jwt-key-alias.label=Key alias
config.jwt-key-password.label=Key password
config.jwt-key-id.label=Key id
config.jwt-key-id.description=kid header of the assertions.
config.jwt-algorithm.label=Algorithm
config.jwt-algorithm.description=RS256, PS256/384/512 or ES256/384/512; by default from the key.
config.jwt-assertion-audience.label=Assertion audience
config.jwt-assertion-audience.description=aud of the assertions; the token endpoint by default.
config.jwt-assertion-lifespan.label=Assertion lifespan
config.jwt-assertion-lifespan.description=Seconds an assertion is valid.
config.group.assertion-key.label=Client assertion key
config.group.assertion-key.description=The key the client assertions are signed with: a PEM file or a keystore; without either the key the server holds for the Keycloak system.
config.group.assertion.label=Client assertion
config.group.assertion.description=The signed JWT sent with every token request.
config.client-secret.label=Client secret
config.client-secret.description=Secret of the client, for client_secret_basic and client_secret_post.
authorization-engine.authzen.default.label=Evaluate by default
authorization-engine.authzen.default.description=Whether systems whose authorization block says nothing are evaluated.
authorization-engine.authzen.systems-without-pdp.label=Systems without a PDP
authorization-engine.authzen.systems-without-pdp.description=What an evaluated system without a PDP URL means: deny its calls or skip the check.
authorization-engine.authzen.url.label=PDP URL
authorization-engine.authzen.url.description=The PDP's evaluation endpoint (http or https); may contain {system} and {realm}.
authorization-engine.authzen.auth.label=Authentication
authorization-engine.authzen.auth.description=How the server authenticates at the PDP: none, header, client-credentials or system-client.
authorization-engine.authzen.header-name.label=Header name
authorization-engine.authzen.header-name.description=auth=header: the request header.
authorization-engine.authzen.header-value.label=Header value
authorization-engine.authzen.header-value.description=auth=header: its value as sent, e.g. Bearer abc.
authorization-engine.authzen.token-url.label=Token endpoint
authorization-engine.authzen.token-url.description=auth=client-credentials: the token endpoint (http or https).
authorization-engine.authzen.client-id.label=Client id
authorization-engine.authzen.client-id.description=auth=client-credentials: the client.
authorization-engine.authzen.client-auth.label=Client authentication
authorization-engine.authzen.client-auth.description=auth=client-credentials: client_secret_basic, client_secret_post, private_key_jwt or an extension's method.
authorization-engine.authzen.scope.label=Scope
authorization-engine.authzen.scope.description=Scope requested with the PDP's tokens.
authorization-engine.authzen.on-error.label=On error
authorization-engine.authzen.on-error.description=What a PDP that cannot be reached or answers nonsense means.
authorization-engine.authzen.send-args.label=Send arguments
authorization-engine.authzen.send-args.description=Whether the call's arguments go into context.args (sensitive ones are masked).
authorization-engine.authzen.connect-timeout.label=Connect timeout
authorization-engine.authzen.connect-timeout.description=Unset: kc-mcp.http.connect-timeout.
authorization-engine.authzen.read-timeout.label=Read timeout
authorization-engine.authzen.read-timeout.description=Every tool call waits for the PDP.
authorization-engine.authzen.tls-configuration-name.label=TLS configuration
authorization-engine.authzen.tls-configuration-name.description=Named TLS configuration (quarkus.tls.<name>.*) for the calls to the PDP.
authorization-engine.authzen.group.evaluation.label=Evaluation
authorization-engine.authzen.group.evaluation.description=Which systems' tool calls the PDP decides.
authorization-engine.authzen.group.pdp.label=Policy decision point
authorization-engine.authzen.group.pdp.description=The default PDP; a system's authorization block can override every setting.
authorization-engine.authzen.group.authentication.label=Authentication at the PDP
authorization-engine.authzen.group.authentication.description=How the server proves itself to the PDP.
confirmer.ciba.issuer.label=Issuer
confirmer.ciba.issuer.description=Issuer URL of the CIBA client, or caller for the issuer of the caller's token.
confirmer.ciba.token-issuer.label=Token issuer
confirmer.ciba.token-issuer.description=The iss of the provider's tokens when it differs from the URL the server reaches it at.
confirmer.ciba.client-id.label=Client id
confirmer.ciba.client-id.description=The confidential client registered for CIBA.
confirmer.ciba.client-secret.label=Client secret
confirmer.ciba.client-auth.label=Client authentication
confirmer.ciba.scope.label=Scope
confirmer.ciba.acr-values.label=ACR values
confirmer.ciba.acr-values.description=Optional acr_values, e.g. to demand a second factor on the device.
confirmer.ciba.login-hint.label=Login hint
confirmer.ciba.login-hint.description=username (the caller's name) or the token claim the provider resolves the user by.
confirmer.ciba.binding-message.label=Binding message
confirmer.ciba.binding-message-prefix.label=Binding message prefix
confirmer.ciba.requested-expiry.label=Requested expiry
confirmer.ciba.requested-expiry.description=Whether to ask for requested_expiry = the timeout.
confirmer.ciba.timeout-seconds.label=Timeout (seconds)
confirmer.ciba.timeout-seconds.description=How long to wait for the approval; kc-mcp.confirm-timeout-seconds by default.
confirmer.ciba.when.label=When
confirmer.ciba.when.description=always, or without-elicitation to let a client that can ask the human itself do so.
confirmer.ciba.flow.label=Flow
confirmer.ciba.flow.description=two-step: answer at once and collect the approval with the next call; blocking: wait.
confirmer.ciba.number-matching.label=Number matching
confirmer.ciba.extra-parameters.label=Extra parameters
confirmer.ciba.extra-parameters.description=Send requester and operation as additional request parameters.
confirmer.ciba.poll-wait-seconds.label=Poll wait (seconds)
confirmer.ciba.tls-configuration-name.label=TLS configuration
confirmer.ciba.connect-timeout.label=Connect timeout
confirmer.ciba.connect-timeout.description=Unset: kc-mcp.http.connect-timeout.
confirmer.ciba.read-timeout.label=Read timeout
confirmer.ciba.read-timeout.description=Unset: kc-mcp.http.read-timeout.
confirmer.ciba.group.provider.label=OpenID provider
confirmer.ciba.group.provider.description=Where the authentication requests go, and how the server reaches it.
confirmer.ciba.group.client.label=Client
confirmer.ciba.group.client.description=The confidential client with the CIBA grant.
confirmer.ciba.group.request.label=Authentication request
confirmer.ciba.group.request.description=What the request says about the user and what the device shows.
confirmer.ciba.group.approval.label=Approval
confirmer.ciba.group.approval.description=When the human is asked and how the answer is collected.
access-check.group-scope.anonymous.label=Anonymous callers
access-check.group-scope.anonymous.description=allow skips the check for anonymous callers (unprotected endpoint), deny refuses the guarded tools.
access-check.no-escalation.anonymous.label=Anonymous callers
access-check.no-escalation.anonymous.description=allow skips the check for anonymous callers (unprotected endpoint), deny refuses the guarded tools.
access-check.self-protection.anonymous.label=Anonymous callers
access-check.self-protection.anonymous.description=allow skips the check for anonymous callers (unprotected endpoint), deny refuses the guarded tools.
access-check.group-scope.super-roles.label=Super roles
access-check.group-scope.super-roles.description=Role keys that bypass the check, besides realm:admin and realm-management.realm-admin.
access-check.no-escalation.super-roles.label=Super roles
access-check.no-escalation.super-roles.description=Role keys that bypass the check, besides realm:admin and realm-management.realm-admin.
access-check.self-protection.super-roles.label=Super roles
access-check.self-protection.super-roles.description=Role keys that bypass the check, besides realm:admin and realm-management.realm-admin.
access-check.group-scope.scope.label=Scope
access-check.group-scope.scope.description=group: the caller must be in the target group or an ancestor; organization: caller and group share an organization.
access-check.group-scope.manager-role.label=Manager role
access-check.group-scope.manager-role.description=Role the caller must hold for group management under the scope, e.g. realm:group-manager.
access-check.self-protection.mode.label=Mode
access-check.self-protection.mode.description=reject, confirm (only the human's own confirmation lets it through) or off.
access-check.self-protection.tools.label=Guarded tools
access-check.self-protection.tools.description=<tool>=<user argument> entries guarded besides the built-in ones; an empty argument removes a built-in tool.

# problems
access-check.invalid-placeholder={key}: {error}
access-check.self-protection.invalid-tool-entry={key}: entries are <tool>=<user argument> (an empty argument removes a built-in tool), not '{value}'
authzen.not-http-url={key} must be an http(s) URL, not '{value}'
authzen.header-value-needed=auth=header needs {key}
authzen.client-credentials-incomplete={key}=client-credentials needs a token-url and a client-id
ciba.callers-required=CIBA needs authenticated callers, or there is nobody whose device could be asked: set kc-mcp.require-caller=true, kc-mcp.delegation=forward|exchange, or kc-mcp.profile=shared
ciba.approval-store-missing=CIBA needs a store for the pending approvals: configure the database storage or enable kc-mcp.spi.approval-store.memory-approvals
client-auth.unknown-method={key}={value} is not a known client authentication method; known: {known}
client-auth.private-key-jwt.both-key-sources={key} and {other} are both set; the key file is used, the keystore ignored
http.tls-registry-missing={key}={value} needs the TLS registry
http.tls-unknown={key}={value} names no TLS configuration: define quarkus.tls.{value}.trust-store.*
http.tls-no-trust-store=TLS configuration '{value}' ({key}) has no trust store: set quarkus.tls.{value}.trust-store.*
