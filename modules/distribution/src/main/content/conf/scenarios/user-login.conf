# The user's own identity: the MCP client logs the user in at Keycloak (browser, code flow with PKCE) and every
# Admin API call runs with their token, so Keycloak enforces their realm-management roles. The server holds no admin
# credentials. Keycloak: a public client (mcp-consumer) with PKCE, the MCP clients' redirect URIs and an Audience
# mapper adding aud=mcp-admin; the kc-admin-api scope on it for Keycloak 26.8.2+. Client setup: docs/integrations.md.
# Keycloak must be up before the server starts: it reads the realm's discovery document.
#   bin/kcmcp.sh start --config conf/scenarios/user-login.conf
kc-mcp.systems.default.url=http://localhost:8080
kc-mcp.systems.default.auth-realm=demo
kc-mcp.delegation=forward
kc-mcp.systems.default.default-realm=demo
kc-mcp.systems.default.allowed-realms=demo
kc-mcp.tool-exposure=hybrid
quarkus.oidc.tenant-enabled=true
quarkus.oidc.token.audience=mcp-admin
# Realm admins are told to pass confirm: true right away instead of being asked first (guidance only).
kc-mcp.model-confirmation-trusted-roles=realm-management.realm-admin
# When Keycloak is reached at an internal address, the tokens and the browser still use the public one:
#quarkus.oidc.token.issuer=https://sso.example.com/realms/demo
#quarkus.oidc.resource-metadata.authorization-server=https://sso.example.com/realms/demo
