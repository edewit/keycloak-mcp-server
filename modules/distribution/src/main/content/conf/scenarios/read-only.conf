# Read-only auditor: a service account with view-* roles only, plus the server-side read-only switch, so a wrong
# role on the client still cannot change anything. Lazy exposure: the model sees search_tools and execute_tool.
#   bin/kcmcp.sh start --config conf/scenarios/read-only.conf
kc-mcp.systems.default.url=http://localhost:8080
kc-mcp.systems.default.auth-realm=demo
kc-mcp.systems.default.grant-type=client_credentials
kc-mcp.systems.default.client-id=mcp-readonly
kc-mcp.systems.default.client-secret=change-me
kc-mcp.systems.default.default-realm=demo
kc-mcp.systems.default.allowed-realms=demo
kc-mcp.read-only=true
kc-mcp.tool-exposure=lazy
