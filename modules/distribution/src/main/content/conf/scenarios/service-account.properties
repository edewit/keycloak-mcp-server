# Service account: a confidential client inside the realm it administers, with the realm-management roles it needs
# (realm-admin for everything, or only view-users, manage-users, ... for less). Keycloak: Clients -> create a client,
# turn on "Client authentication" and "Service accounts roles", assign the roles under "Service account roles", copy
# the secret from "Credentials". On Keycloak 26.8.2+ also add the client scope kc-admin-api as a default scope.
#   bin/kcmcp.sh start --config conf/scenarios/service-account.properties
kc-mcp.url=http://localhost:8080
kc-mcp.auth-realm=demo
kc-mcp.grant-type=client_credentials
kc-mcp.client-id=mcp-admin
kc-mcp.client-secret=change-me
kc-mcp.default-realm=demo
kc-mcp.allowed-realms=demo
kc-mcp.tool-exposure=hybrid
