# Read-only auditor: a service account with view-* roles only, plus the server-side read-only switch, so a wrong
# role on the client still cannot change anything. Lazy exposure: the model sees search_tools and execute_tool.
#   bin/kcmcp.sh start --config conf/scenarios/read-only.properties
kc-mcp.url=http://localhost:8080
kc-mcp.auth-realm=demo
kc-mcp.grant-type=client_credentials
kc-mcp.client-id=mcp-readonly
kc-mcp.client-secret=change-me
kc-mcp.default-realm=demo
kc-mcp.allowed-realms=demo
kc-mcp.read-only=true
kc-mcp.tool-exposure=lazy
