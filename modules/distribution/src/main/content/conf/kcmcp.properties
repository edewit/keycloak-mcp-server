# keycloak-mcp-server configuration. Read by bin/kcmcp.sh and bin/kcmcp.bat; properties as in docs/configuration.md.
# Everything here can also be set as an environment variable (kc-mcp.url -> KC_MCP_URL) or on the command line
# (bin/kcmcp.sh start --kc-mcp.url=...). ${kcmcp.home.dir} is the directory this distribution was unpacked to.
#
# Ready-made settings for common setups are in conf/scenarios/; start one with
#   bin/kcmcp.sh start --config conf/scenarios/service-account.properties

# ---------------------------------------------------------------------------------------------------------------
# The Keycloak the server administers
# ---------------------------------------------------------------------------------------------------------------

# Base URL, context path included (https://sso.example.com/auth).
#kc-mcp.url=http://localhost:8080

# Realm the server's own client or user lives in.
#kc-mcp.auth-realm=master

# Several Keycloak systems instead: kc-mcp.systems.<name>.url and the other settings per system; see docs/systems.md.
#kc-mcp.systems.prod.url=https://sso.example.com
#kc-mcp.systems.staging.url=https://sso-staging.example.com
#kc-mcp.default-system=prod

# ---------------------------------------------------------------------------------------------------------------
# How the server authenticates at Keycloak: pick one block
# ---------------------------------------------------------------------------------------------------------------

# 1. A service account (confidential client with service accounts enabled and the realm-management roles it needs).
#kc-mcp.grant-type=client_credentials
#kc-mcp.client-id=mcp-admin
#kc-mcp.client-secret=change-me

# 2. The same client with a signed JWT instead of a secret; Keycloak fetches the public key from this server's JWKS.
#kc-mcp.client-auth=private_key_jwt
#kc-mcp.jwt.key-file=${kcmcp.home.dir}/conf/mcp-admin.pem

# 3. No server credentials: the users log in through their MCP client and every call runs with their own token
#    (forward delegation). The audience must match the mapper on the client the users log in with.
#kc-mcp.delegation=forward
#quarkus.oidc.tenant-enabled=true
#quarkus.oidc.token.audience=mcp-admin

# ---------------------------------------------------------------------------------------------------------------
# What the model may reach
# ---------------------------------------------------------------------------------------------------------------

#kc-mcp.default-realm=demo
#kc-mcp.allowed-realms=demo
#kc-mcp.read-only=false
#kc-mcp.denied-tools=keycloak_user_delete
#kc-mcp.tool-exposure=hybrid

# ---------------------------------------------------------------------------------------------------------------
# A server other people reach: the shared profile
# ---------------------------------------------------------------------------------------------------------------

# shared requires caller authentication (block 3 above), kc-mcp.allowed-hosts and, with the database storage, the
# storage key; see docs/security.md.
#kc-mcp.profile=shared
#kc-mcp.allowed-hosts=sso.example.com
#quarkus.http.host=0.0.0.0

# ---------------------------------------------------------------------------------------------------------------
# HTTP
# ---------------------------------------------------------------------------------------------------------------

#quarkus.http.port=8081
# Behind a TLS terminating proxy or load balancer:
#quarkus.http.proxy.proxy-address-forwarding=true
#quarkus.http.proxy.trusted-proxies=10.0.0.0/8

# ---------------------------------------------------------------------------------------------------------------
# Database storage (systems, keys, secrets, audit, sessions); see docs/storage.md
# ---------------------------------------------------------------------------------------------------------------

# Embedded H2 for one instance (the default build), PostgreSQL for several (a -Ppostgresql build).
#quarkus.datasource.jdbc.url=jdbc:h2:file:${kcmcp.home.dir}/data/kc-mcp
#quarkus.datasource.jdbc.url=jdbc:postgresql://db:5432/kcmcp
#quarkus.datasource.username=kcmcp
#quarkus.datasource.password=change-me
#kc-mcp.storage.secret-key=base64-of-32-random-bytes
#kc-mcp.dynamic-systems=true

# ---------------------------------------------------------------------------------------------------------------
# Logging and metrics
# ---------------------------------------------------------------------------------------------------------------

#quarkus.log.level=INFO
#quarkus.log.file.enable=true
#quarkus.log.file.path=${kcmcp.home.dir}/data/log/kcmcp.log
#quarkus.otel.sdk.disabled=false
#quarkus.otel.exporter.otlp.endpoint=http://otel-collector:4317
