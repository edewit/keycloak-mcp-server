# keycloak-mcp-server configuration. Read by bin/kcmcp.sh and bin/kcmcp.bat; properties as in docs/configuration.md.
# Everything here can also be set as an environment variable (kc-mcp.systems.default.url -> KC_MCP_SYSTEMS_DEFAULT_URL) or on the command line
# (bin/kcmcp.sh start --kc-mcp.systems.default.url=...). ${kcmcp.home.dir} is the directory this distribution was unpacked to.
#
# Templates with ready-made settings for common setups are in conf/scenarios/; copy one next to this file and start it:
#   cp conf/scenarios/service-account.conf.example conf/service-account.conf
#   bin/kcmcp.sh start --config conf/service-account.conf

# ---------------------------------------------------------------------------------------------------------------
# The Keycloak systems the server administers
# ---------------------------------------------------------------------------------------------------------------

# Every Keycloak is a named system, kc-mcp.systems.<name>.*; a system exists when its url is set. One Keycloak: call
# it "default". Base URL with the context path (https://sso.example.com/auth); the realm the server's own client lives
# in (default master).
#kc-mcp.systems.default.url=http://localhost:8080
#kc-mcp.systems.default.auth-realm=master

# Several systems: one block each, or one file each in conf/systems/ (bin/kcmcp.sh start --config conf/systems/).
# Settings a system leaves out come from kc-mcp.system-defaults.*; see docs/systems.md. With several systems only
# kc-mcp.default-system makes one the default (the name "default" alone does not); with user login it is needed
# unless quarkus.oidc.auth-server-url is set.
#kc-mcp.systems.prod.url=https://sso.example.com
#kc-mcp.systems.staging.url=https://sso-staging.example.com
#kc-mcp.default-system=prod

# ---------------------------------------------------------------------------------------------------------------
# How the server authenticates at Keycloak: pick one block (per system, or once for all in kc-mcp.system-defaults.*)
# ---------------------------------------------------------------------------------------------------------------

# 1. A service account (confidential client with service accounts enabled and the realm-management roles it needs).
#kc-mcp.systems.default.grant-type=client_credentials
#kc-mcp.systems.default.client-id=mcp-admin
#kc-mcp.systems.default.client-secret=change-me

# 2. The same client with a signed JWT instead of a secret; Keycloak fetches the public key from this server's JWKS.
#kc-mcp.systems.default.client-auth=private_key_jwt
#kc-mcp.jwt.key-file=${kcmcp.home.dir}/conf/mcp-admin.pem

# 3. No server credentials: the users log in through their MCP client and every call runs with their own token
#    (forward delegation). The audience must match the mapper on the client the users log in with.
#kc-mcp.delegation=forward
#quarkus.oidc.tenant-enabled=true
#quarkus.oidc.token.audience=mcp-admin

# ---------------------------------------------------------------------------------------------------------------
# What the model may reach
# ---------------------------------------------------------------------------------------------------------------

#kc-mcp.systems.default.default-realm=demo
#kc-mcp.systems.default.allowed-realms=demo
#kc-mcp.read-only=false
#kc-mcp.denied-tools=keycloak_user_delete
#kc-mcp.tool-exposure=hybrid

# ---------------------------------------------------------------------------------------------------------------
# A server other people reach: the shared profile
# ---------------------------------------------------------------------------------------------------------------

# shared requires caller authentication (block 3 above), kc-mcp.allowed-hosts and, with the database storage, the
# storage key; see docs/security.md.
#kc-mcp.security-profile=shared
#kc-mcp.allowed-hosts=sso.example.com
#quarkus.http.host=0.0.0.0

# ---------------------------------------------------------------------------------------------------------------
# HTTP
# ---------------------------------------------------------------------------------------------------------------

#quarkus.http.port=8081
# HTTPS, as in Keycloak: a PEM pair or a key store; see docs/tls.md and conf/scenarios/https.conf.example.
#kc-mcp.https-certificate-file=${kcmcp.home.dir}/conf/server.crt.pem
#kc-mcp.https-certificate-key-file=${kcmcp.home.dir}/conf/server.key.pem
#kc-mcp.https-key-store-file=${kcmcp.home.dir}/conf/server.p12
#kc-mcp.https-key-store-password=change-me
#kc-mcp.https-port=8443
#kc-mcp.http-enabled=false
# A Keycloak behind a private CA: put the CA into conf/truststores/, or list files and directories here.
#kc-mcp.truststore-paths=/etc/pki/my-company-ca.pem
# The address clients use: fixes the links the server hands out, with or without a proxy; see docs/tls.md.
#kc-mcp.hostname=https://mcp.example.com
# Behind a TLS terminating proxy or load balancer:
#quarkus.http.proxy.proxy-address-forwarding=true
#quarkus.http.proxy.trusted-proxies=10.0.0.0/8

# ---------------------------------------------------------------------------------------------------------------
# Database storage (systems, keys, secrets, audit, sessions); see docs/storage.md
# ---------------------------------------------------------------------------------------------------------------

# Embedded H2 for one instance (the default build), PostgreSQL for several (a -Ppostgresql build).
#quarkus.datasource.jdbc.url=jdbc:h2:file:${kcmcp.home.dir}/data/kc-mcp
#quarkus.datasource.jdbc.url=jdbc:postgresql://db:5432/kcmcp
#quarkus.datasource.username=kcmcp
#quarkus.datasource.password=change-me
#kc-mcp.storage.secret-key=base64-of-32-random-bytes
#kc-mcp.dynamic-systems=true

# ---------------------------------------------------------------------------------------------------------------
# Logging and metrics
# ---------------------------------------------------------------------------------------------------------------

#quarkus.log.level=INFO
#quarkus.log.file.enable=true
#quarkus.log.file.path=${kcmcp.home.dir}/data/log/kcmcp.log
#quarkus.otel.sdk.disabled=false
#quarkus.otel.exporter.otlp.endpoint=http://otel-collector:4317
