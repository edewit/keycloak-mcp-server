# English texts of the configuration problems the server reports (ConfigProblem codes); UTF-8.
# Named arguments in braces: {key} is the full key of the setting.
config.invalid-value={key} must be {expected}
config.required={key} is required
config.unknown-key={key} is not a setting of this extension and is ignored; it reads {known}
config.validation-failed=The settings could not be checked: {error}
