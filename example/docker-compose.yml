# Demo stack for keycloak-mcp-server: Keycloak 26.8.1 + PostgreSQL + Mailpit (+ optional MCP server).
#
#   docker compose up -d                 # Keycloak on http://localhost:8080 (admin / admin), Mailpit on :8025
#   docker compose --profile mcp up -d   # also runs the MCP server from ../target/quarkus-app on :8081
#   docker compose down -v               # reset everything
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ./realms:/opt/keycloak/data/import:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets Keycloak fetch the MCP server's JWKS (private_key_jwt demo)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # the image has no curl; talk HTTP to the management port with bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP

  # Optional: the MCP server itself, built from this repository (run ../mvnw package first).
  mcp:
    profiles: ["mcp"]
    build:
      context: ..
      dockerfile: src/main/docker/Dockerfile.jvm
    env_file:
      - ${KC_MCP_ENV_FILE:-env/realm-admin.env}
    environment:
      KC_MCP_URL: http://keycloak:8080
      KC_MCP_JWT_KEY_FILE: /keys/mcp-jwt.pem
      QUARKUS_HTTP_PORT: "8081"
      QUARKUS_HTTP_HOST: 0.0.0.0
    volumes:
      - ./keys:/keys:ro
    ports:
      - "8081:8081"
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  pgdata:
