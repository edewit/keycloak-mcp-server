# CIBA confirmation demo: Keycloak 26.8.2 with the CIBA grant and its HTTP authentication channel pointing at a small
# "approver" service that stands in for the user's device, plus the optional MCP server. See README.md.
#
#   docker compose up -d                          # Keycloak on http://localhost:8098 (admin / admin), approver on :8095
#   docker compose --profile mcp up -d --build    # also the MCP server from ../../modules/backend/target on :8099
#   docker compose down -v                        # reset everything (the realm is re-imported on the next start)
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8098
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_FEATURES: identity-brokering-api:v2
      KC_FEATURES_DISABLED: twitter-broker
      KC_LOG_LEVEL: info
      # Where Keycloak delivers CIBA authentication requests (the "authentication device"): the approver below.
      # CLI form: --spi-ciba-auth-channel--ciba-http-auth-channel--http-authentication-channel-uri=...
      KC_SPI_CIBA_AUTH_CHANNEL__CIBA_HTTP_AUTH_CHANNEL__HTTP_AUTHENTICATION_CHANNEL_URI: http://approver:8095/auth
    volumes:
      - ./realms:/opt/keycloak/data/import:ro
    ports:
      - "8098:8080"
    healthcheck:
      # the image has no curl; talk HTTP to the management port with bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # The user's "device": receives Keycloak's authentication requests and lets the user they are meant for sign in
  # (OpenID Connect, public client ciba-approver) at http://localhost:8095/ to approve, with the number from the
  # chat, or decline; answers Keycloak's callback. A single-file Java program, no build step.
  approver:
    image: eclipse-temurin:21
    command: ["java", "/app/Approver.java"]
    environment:
      PORT: "8095"
      PUBLIC_URL: http://localhost:8095
      KC_URL: http://keycloak:8080             # how the app reaches Keycloak (token, userinfo, callback)
      KC_PUBLIC_URL: http://localhost:8098     # how the user's browser reaches Keycloak (login)
      KC_REALM: demo
      CLIENT_ID: ciba-approver
      REQUEST_TTL_SECONDS: "120"              # the realm's cibaExpiresIn: older requests have expired at Keycloak
    volumes:
      - ./approver:/app:ro
    ports:
      - "8095:8095"

  # Optional: the MCP server itself, built from this repository (run ../../mvnw package -DskipTests first).
  mcp:
    profiles: ["mcp"]
    build:
      context: ../..
      dockerfile: modules/backend/src/main/docker/Dockerfile.jvm
    env_file:
      - ${KC_MCP_ENV_FILE:-env/ciba.env}
    environment:
      # inside the compose network Keycloak is reached as keycloak:8080; the tokens still name the public issuer
      KC_MCP_SYSTEMS_DEFAULT_URL: http://keycloak:8080
      QUARKUS_OIDC_TOKEN_ISSUER: http://localhost:8098/realms/demo
      # what the protected resource metadata sends MCP clients (LM Studio) to for the login: the public address
      QUARKUS_OIDC_RESOURCE_METADATA_AUTHORIZATION_SERVER: http://localhost:8098/realms/demo
      # the container reaches the realm as keycloak:8080, the tokens it issues name the public issuer
      KC_MCP_SPI_CIBA_CONFIRMER_ISSUER: http://keycloak:8080/realms/demo
      KC_MCP_SPI_CIBA_CONFIRMER_TOKEN_ISSUER: http://localhost:8098/realms/demo
      QUARKUS_HTTP_PORT: "8081"
      QUARKUS_HTTP_HOST: 0.0.0.0
    ports:
      - "8099:8081"
    depends_on:
      keycloak:
        condition: service_healthy
