# Cross-App Access (ID-JAG, MCP Enterprise-Managed Authorization): Keycloak 26.8.2 as the MCP server's authorization
# server accepting ID-JAGs (identity-assertion-jwt, experimental), a stand-in enterprise IdP issuing them, and the MCP
# server forwarding the resulting user tokens to the Admin API. See README.md.
#
#   docker compose up -d                          # Keycloak on http://localhost:8101 (admin / admin), IdP on :8102
#   docker compose --profile mcp up -d --build    # also the MCP server from ../../modules/backend/target on :8103
#   docker compose down -v                        # reset everything (the realm is re-imported on the next start)
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8101
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # the JWT authorization grant for ID-JAGs (experimental); the rest are the 26.8 defaults the other examples use
      KC_FEATURES: identity-assertion-jwt,identity-brokering-api:v2
      KC_FEATURES_DISABLED: twitter-broker
      KC_LOG_LEVEL: info
    volumes:
      - ./realms:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8101:8080"
    healthcheck:
      # the image has no curl; talk HTTP to the management port with bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # The enterprise IdP: Keycloak cannot issue ID-JAGs yet (keycloak#48818), so a standard-library Python script does.
  # Its issuer is the public http://localhost:8102; Keycloak fetches the JWKS as http://idp:8102/jwks.
  idp:
    image: python:3.13-slim
    command: ["python3", "-I", "/idp/idp.py", "--host", "0.0.0.0", "--issuer", "http://localhost:8102"]
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./idp:/idp:ro
    ports:
      - "127.0.0.1:8102:8102"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/jwks')"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional: the MCP server itself, built from this repository (run ../../mvnw package -DskipTests first).
  mcp:
    profiles: ["mcp"]
    build:
      context: ../..
      dockerfile: modules/backend/src/main/docker/Dockerfile.jvm
    env_file:
      - env/xaa.env
    environment:
      # inside the compose network Keycloak is reached as keycloak:8080; the tokens still name the public issuer
      KC_MCP_SYSTEMS_DEFAULT_URL: http://keycloak:8080
      KC_MCP_SYSTEMS_DEFAULT_ISSUER: http://localhost:8101/realms/acme
      QUARKUS_OIDC_TOKEN_ISSUER: http://localhost:8101/realms/acme
      QUARKUS_OIDC_RESOURCE_METADATA_AUTHORIZATION_SERVER: http://localhost:8101/realms/acme
      QUARKUS_HTTP_PORT: "8081"
      QUARKUS_HTTP_HOST: 0.0.0.0
    ports:
      - "8103:8081"
    depends_on:
      keycloak:
        condition: service_healthy
