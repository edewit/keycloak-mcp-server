# Keycloak 26.8.2 on https://localhost:8100 (admin / admin) with Client ID Metadata Documents, the demo realm imported
# from realms/ on the first start. The realm has no OAuth client for the MCP client: see README.md.
#
#   ../../etc/mkcert.sh           # once: the certificate for localhost, VS Code refuses a plain http login server
#   docker compose up -d --wait   # start
#   ./setup.sh                    # then: the two client scopes a client created from its metadata document gets
#   docker compose down -v        # reset everything
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: https://localhost:8100
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/localhost.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/localhost-key.pem
      # only inside the container, for kcadm in setup.sh and the health check
      KC_HTTP_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_HEALTH_ENABLED: "true"
      # Experimental in 26.8. Not resource-indicators: see "Why not resource indicators" in README.md.
      KC_FEATURES: cimd
      KC_LOG_LEVEL: info
    volumes:
      - ./realms:/opt/keycloak/data/import:ro
      - ../../.certs:/opt/keycloak/certs:ro
    ports:
      - "127.0.0.1:8100:8443"
    healthcheck:
      # the image has no curl; talk HTTP to the management port with bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

networks:
  default:
    ipam:
      config:
        - subnet: 10.96.0.0/24
