# Delegated authentication: Keycloak 26.8.2 with token exchange delegation (preview), a `demo` realm whose users may
# let the client `keycloak-mcp` act on their behalf, and the MCP server as that client. See README.md.
#
#   docker compose up -d                          # Keycloak on http://localhost:8096 (admin / admin), permission granted
#   docker compose --profile mcp up -d --build    # also the MCP server from ../../modules/backend/target on :8097
#   docker compose down -v                        # reset everything (the realm is re-imported on the next start)
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8096
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # token exchange delegation needs parameterized scopes (both preview); the rest are the 26.8 defaults the other
      # examples use (v2 brokering API, no Twitter broker)
      KC_FEATURES: token-exchange-delegation,parameterized-scopes,identity-brokering-api:v2
      KC_FEATURES_DISABLED: twitter-broker
      KC_LOG_LEVEL: info
    volumes:
      - ./realms:/opt/keycloak/data/import:ro
    ports:
      - "8096:8080"
    healthcheck:
      # the image has no curl; talk HTTP to the management port with bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # The one setting a realm import cannot carry: the Admin Permissions grant that lets keycloak-mcp act for users.
  keycloak-init:
    image: quay.io/keycloak/keycloak:26.8.2
    entrypoint: ["/bin/bash", "/grant-delegation.sh"]
    volumes:
      - ./init/grant-delegation.sh:/grant-delegation.sh:ro
    depends_on:
      keycloak:
        condition: service_healthy

  # Optional: the MCP server itself, built from this repository (run ../../mvnw package -DskipTests first).
  mcp:
    profiles: ["mcp"]
    build:
      context: ../..
      dockerfile: modules/backend/src/main/docker/Dockerfile.jvm
    env_file:
      - ${KC_MCP_ENV_FILE:-env/delegation.env}
    environment:
      # inside the compose network Keycloak is reached as keycloak:8080; the tokens still name the public issuer
      KC_MCP_SYSTEMS_DEFAULT_URL: http://keycloak:8080
      KC_MCP_SYSTEMS_DEFAULT_ISSUER: http://localhost:8096/realms/demo
      QUARKUS_OIDC_TOKEN_ISSUER: http://localhost:8096/realms/demo
      # what the protected resource metadata sends MCP clients (LM Studio) to for the login: the public address
      QUARKUS_OIDC_RESOURCE_METADATA_AUTHORIZATION_SERVER: http://localhost:8096/realms/demo
      QUARKUS_HTTP_PORT: "8081"
      QUARKUS_HTTP_HOST: 0.0.0.0
    ports:
      - "8097:8081"
    depends_on:
      keycloak:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully
