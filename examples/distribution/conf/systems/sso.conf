# The one Keycloak of this setup. Master realm users log in at the system entry /mcp/systems/sso (login realm
# master) and a master admin administers every realm: the default realm is their own, the realm argument names any
# other. Demo realm users log in at the realm entry /mcp/systems/sso/demo: that entry logs them in at the demo
# realm and binds every call to it, so they never reach another realm; what they may do there is decided by their
# realm-management roles (alice: realm-admin, carol: view-users).
kc-mcp.systems.sso.url=http://localhost:8080
kc-mcp.systems.sso.auth-realm=master
kc-mcp.systems.sso.default-realm=master
